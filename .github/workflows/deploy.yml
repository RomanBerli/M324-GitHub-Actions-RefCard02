name: CI/CD Pipeline zu AWS EC2 und DockerHub (EX-01)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        # Hinweis: Setzt voraus, dass in der package.json ein Test-Skript (z.B. Vitest/Jest) definiert ist
        run: npm test --if-present

  build:
    name: Build App
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Build Project
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'http://127.0.0.1:3001/' }}
          VITE_IMGS: ${{ vars.VITE_IMGS || 'items' }}
        
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist/
          retention-days: 1

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: dist/
          
      - name: Deploy to EC2 via SSH/rsync
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.EC2_HOST || vars.EC2_HOST }}
          REMOTE_USER: ${{ secrets.EC2_USERNAME || secrets.EC2_USER || vars.EC2_USERNAME || vars.EC2_USER || 'ec2-user' }}
          TARGET: ${{ vars.EC2_TARGET_DIR || secrets.EC2_TARGET_DIR || '/var/www/react-app' }}
          SOURCE: "dist/"
          ARGS: "-rlgoDzvc -i"

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN || secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'http://127.0.0.1:3001/' }}
            VITE_IMGS=${{ vars.VITE_IMGS || 'items' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}/biztrips:prod01
            ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}/biztrips:latest
            ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}/biztrips:${{ github.sha }}